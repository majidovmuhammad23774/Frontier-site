name: Build APK Bronelom

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool \
            pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.33

      - name: Build APK
        run: |
          yes | buildozer -v android debug 2>&1 | tail -200

      - name: Find APK
        if: always()
        run: |
          find /home/runner -name "*.apk" 2>/dev/null

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bronelom-apk
          path: |
            bin/*.apk
            **/*.apk
          if-no-files-found: warn
