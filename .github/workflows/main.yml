name: Build APK Bronelom

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool \
            pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.36
          pip install legacy-cgi

      - name: Build APK
        run: |
          yes | buildozer -v android debug 2>&1 | tail -200

      - name: Find APK files
        run: |
          echo "=== Поиск APK ==="
          find . -name "*.apk" -type f 2>/dev/null || echo "APK не найден"
          echo "=== Содержимое bin/ ==="
          ls -la bin/ 2>/dev/null || echo "Папки bin/ нет"

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bronelom-apk
          path: |
            bin/*.apk
            **/*.apk
          if-no-files-found: warn