name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip openjdk-17-jdk \
          python3-pip autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev \
          libtinfo5 cmake libffi-dev libssl-dev

    - name: Install buildozer
      run: |
        pip3 install --user --upgrade "setuptools<70"
        pip3 install --user --upgrade buildozer cython==0.29.33

    - name: Build APK
      run: |
        export PATH=$PATH:$HOME/.local/bin
        export P4A_HOSTPYTHON=/usr/bin/python3
        yes | buildozer android debug 2>&1 | tee buildozer.log
        echo "=== APK поиск ==="
        find . -name "*.apk" 2>/dev/null
        ls -la bin/ 2>/dev/null || echo "bin/ не создан"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: bronelom-apk
        path: bin/*.apk
        if-no-files-found: error