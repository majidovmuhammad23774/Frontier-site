name: Build APK Steel Line

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.33

      - name: Check buildozer
        run: |
          which buildozer || true
          python -m buildozer --version || true

      - name: Build APK
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          yes | python -m buildozer -v android debug 2>&1 | tail -100

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steel-line-apk
          path: bin/*.apk
          if-no-files-found: warn