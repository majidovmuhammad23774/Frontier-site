<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(180deg,#0a0e1a,#05080f);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif;color:#d0dae8;padding:20px;text-align:center;overflow-x:hidden}
h1{color:#e8b84a;font-size:34px;font-weight:900;margin-bottom:6px;text-shadow:0 0 25px rgba(232,184,74,0.6);letter-spacing:3px}
.sub{color:#7fc8ff;font-size:14px;margin-bottom:25px}
.games{display:flex;flex-direction:column;gap:18px;width:100%;max-width:420px}
.card{background:linear-gradient(180deg,#152030,#0f1626);border:3px solid #3a6ea5;border-radius:20px;padding:22px 18px;text-decoration:none;color:#fff;display:flex;flex-direction:column;align-items:center;transition:transform 0.15s}
.card:active{transform:scale(0.97)}
.card.tank{border-color:#e8b84a;box-shadow:0 0 30px rgba(232,184,74,0.3)}
.card.space{border-color:#7fc8ff;box-shadow:0 0 30px rgba(127,200,255,0.3)}
.emoji{font-size:60px;margin-bottom:8px}
.card h2{font-size:22px;margin-bottom:6px;font-weight:900}
.card.tank h2{color:#e8b84a}
.card.space h2{color:#7fc8ff}
.card p{font-size:13px;color:#a8b8c8;margin-bottom:14px;line-height:1.5}
.play-btn{display:inline-block;padding:14px 40px;font-size:16px;font-weight:bold;border-radius:12px;color:#fff;width:100%}
.card.tank .play-btn{background:linear-gradient(180deg,#c8a042,#8a6b1e);box-shadow:0 4px 15px rgba(200,160,66,0.5)}
.card.space .play-btn{background:linear-gradient(180deg,#3a6ea5,#244a75);box-shadow:0 4px 15px rgba(58,110,165,0.5)}
.footer{margin-top:30px;font-size:12px;color:#606070}
.footer b{color:#7fc8ff}
</style>
</head>
