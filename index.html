<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Гром Брони 🎃 Технические работы</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:#0a0510;
  background-image:
    radial-gradient(circle at 20% 10%, rgba(255,102,0,0.15) 0%, transparent 40%),
    radial-gradient(circle at 80% 90%, rgba(150,0,200,0.15) 0%, transparent 40%),
    radial-gradient(circle at 50% 50%, #1a0a2e 0%, #0a0510 100%);
  color:#fff;
  font-family:'Segoe UI',Arial,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  padding:20px;
  text-align:center;
  overflow:hidden;
}

/* Летучие мыши */
.bat{position:fixed;font-size:28px;pointer-events:none;animation:fly 15s linear infinite;z-index:1;opacity:0.6}
@keyframes fly{
  0%{transform:translate(-10vw,20vh);}
  25%{transform:translate(30vw,5vh);}
  50%{transform:translate(60vw,30vh);}
  75%{transform:translate(85vw,10vh);}
  100%{transform:translate(110vw,25vh);}
}

.box{
  background:linear-gradient(180deg, rgba(40,20,70,0.9) 0%, rgba(20,10,40,0.9) 100%);
  border:3px solid #ff8c00;
  border-radius:20px;
  padding:40px 25px;
  max-width:500px;
  width:100%;
  position:relative;
  z-index:2;
  box-shadow:0 0 50px rgba(255,140,0,0.5), inset 0 0 30px rgba(255,140,0,0.1);
  animation:pulse 3s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{box-shadow:0 0 50px rgba(255,140,0,0.5), inset 0 0 30px rgba(255,140,0,0.1);}
  50%{box-shadow:0 0 80px rgba(255,140,0,0.8), inset 0 0 40px rgba(255,140,0,0.2);}
}

.emoji{
  font-size:90px;
  display:block;
  margin-bottom:20px;
  animation:swing 2s ease-in-out infinite;
}
@keyframes swing{
  0%,100%{transform:rotate(-10deg);}
  50%{transform:rotate(10deg);}
}

h1{
  font-size:36px;
  font-weight:900;
  letter-spacing:3px;
  background:linear-gradient(180deg,#ffcc00 0%,#ff6600 50%,#cc0066 100%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  margin-bottom:15px;
  line-height:1.1;
}

.subtitle{
  font-size:20px;
  color:#ff8c00;
  font-weight:bold;
  margin-bottom:20px;
  letter-spacing:2px;
}

.text{
  font-size:15px;
  color:#c0b0d0;
  line-height:1.7;
  margin-bottom:25px;
}

.text b{color:#ffcc00}

/* Точки загрузки */
.dots{display:inline-block;font-size:20px;color:#ff8c00}
.dots span{animation:blink 1.4s infinite;display:inline-block}
.dots span:nth-child(2){animation-delay:0.2s}
.dots span:nth-child(3){animation-delay:0.4s}
@keyframes blink{0%,60%,100%{opacity:0.2;}30%{opacity:1;}}

/* Прогресс-бар */
.progress{
  background:rgba(0,0,0,0.5);
  border:2px solid #6a2b9a;
  border-radius:20px;
  height:20px;
  overflow:hidden;
  margin-bottom:20px;
}
.progress-bar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#ff6600,#ffcc00,#ff6600);
  background-size:200% 100%;
  border-radius:20px;
  transition:width 0.5s ease;
  animation:shine 2s linear infinite;
}
@keyframes shine{
  0%{background-position:0% 0;}
  100%{background-position:200% 0;}
}

/* Контакты */
.contact{
  border-top:1px solid rgba(255,140,0,0.3);
  padding-top:20px;
  margin-top:10px;
  font-size:14px;
  color:#a080c0;
}
.contact a{color:#ff8c00;text-decoration:none;font-weight:bold;}

/* Версия */
.version{
  font-size:12px;
  color:#5a3a8a;
  margin-top:15px;
}
</style>
</head>
<body>

<div class="bat" style="animation-delay:0s;">🦇</div>
<div class="bat" style="animation-delay:-5s;">🦇</div>
<div class="bat" style="animation-delay:-10s;">🦇</div>

<div class="box">
  <span class="emoji">🔧</span>
  <h1>ГРОМ БРОНИ</h1>
  <div class="subtitle">ТЕХНИЧЕСКИЕ РАБОТЫ<span class="dots"><span>.</span><span>.</span><span>.</span></span></div>

  <div class="text">
    🚀 Мы обновляем игру!<br>
    Скоро будет <b>новая версия</b> с крутыми фишками.<br>
    Спасибо за терпение! 🎃
  </div>

  <div class="progress">
    <div class="progress-bar" id="bar"></div>
  </div>

  <div class="contact">
    📱 Следи за новостями:<br>
    <a href="https://github.com/majidovmuhammad23774/Frontier-site">GitHub</a>
  </div>

  <div class="version">© Мухаммад 2026 · Версия 3.0 в разработке</div>
</div>

<script>
// Прогресс-бар (просто для красоты — показывает "работы идут")
const bar = document.getElementById('bar');
let progress = 0;
setInterval(() => {
  progress += Math.random() * 8;
  if (progress > 95) progress = 15; // сброс, чтобы не выглядело "завершено"
  bar.style.width = progress + '%';
}, 800);

console.log('🔧 Технические работы · Гром Брони');
</script>

</body>
</html>
