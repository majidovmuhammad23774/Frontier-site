<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>БРОНЕЛОМ — Технические работы</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Arial, sans-serif;
    background: linear-gradient(180deg, #0a0a15 0%, #1a1a30 100%);
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 30px;
  }
  .icon {
    font-size: 100px;
    margin-bottom: 30px;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
  }
  h1 {
    font-size: 42px;
    color: #ffcc33;
    text-shadow: 0 0 20px #ff8800;
    margin-bottom: 20px;
    letter-spacing: 3px;
  }
  h2 {
    font-size: 24px;
    color: #4aa3ff;
    margin-bottom: 30px;
  }
  p {
    font-size: 18px;
    color: #b0b0c0;
    line-height: 1.6;
    max-width: 500px;
    margin-bottom: 15px;
  }
  .footer {
    position: fixed;
    bottom: 20px;
    font-size: 14px;
    color: #606070;
  }
  .author {
    margin-top: 40px;
    font-size: 16px;
    color: #808090;
  }
</style>
</head>
<body>

  <div class="icon">⚙️</div>

  <h1>БРОНЕЛОМ</h1>

  <h2>🔧 ТЕХНИЧЕСКИЕ РАБОТЫ 🔧</h2>

  <p>
    Сайт временно недоступен.<br>
    Мы обновляем игру и делаем её лучше.
  </p>

  <p>
    Совсем скоро БРОНЕЛОМ вернётся —<br>
    с новой графикой и новыми возможностями!
  </p>

  <div class="author">
    © Автор: Мухаммад<br>
    2026 год
  </div>

  <div class="footer">
    Следите за обновлениями
  </div>

</body>
</html>
