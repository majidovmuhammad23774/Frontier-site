<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Armor Thunder</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚜</text></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: radial-gradient(circle at 20% 10%, rgba(255,102,0,0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 90%, rgba(150,0,200,0.15) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, #1a0a2e 0%, #0a0510 100%);
    color: #fff;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    user-select: none;
    -webkit-user-select: none;
  }
  .container {
    max-width: 400px;
    width: 100%;
    text-align: center;
  }
  .logo {
    font-size: 42px;
    font-weight: 900;
    letter-spacing: 2px;
    background: linear-gradient(180deg, #ffcc00, #ff6600 50%, #cc0066);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 6px;
  }
  .subtitle {
    font-size: 14px;
    color: #ff6600;
    letter-spacing: 6px;
    font-weight: bold;
    margin-bottom: 30px;
  }
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 16px;
    margin: 10px 0;
    font-size: 18px;
    font-weight: bold;
    color: #fff;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-family: inherit;
    text-decoration: none;
  }
  .btn:active { transform: translateY(3px); }
  .btn-play {
    background: linear-gradient(180deg, #4caf50, #1b5e20);
    box-shadow: 0 4px 0 #0d3010;
  }
  .btn-register {
    background: linear-gradient(180deg, #5a4db8, #2c2470);
    box-shadow: 0 4px 0 #1a1245;
  }
  .btn-news {
    background: linear-gradient(180deg, #9c27b0, #4a1259);
    box-shadow: 0 4px 0 #2a0833;
  }
  .footer {
    margin-top: 20px;
    font-size: 12px;
    color: #8866aa;
  }
</style>
</head>
<body>

<div class="container">
  <div class="logo">🚜 ARMOR THUNDER</div>
  <div class="subtitle">3D 🚜 3D</div>
  
  <a href="register.html" class="btn btn-register">📝 РЕГИСТРАЦИЯ</a>
  <a href="game.html" class="btn btn-play">🎮 ИГРАТЬ</a>
  <a href="news.html" class="btn btn-news">📰 НОВОСТИ</a>
  
  <div class="footer">© 2026 Armor Thunder</div>
</div>

</body>
</html>
